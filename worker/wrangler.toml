# Cloudflare Worker — PaglaAI Operations Team executor.
# Handles cron-triggered jobs (health checks, search pings, GitHub dispatch)
# and exposes an on-demand API on the Workers runtime.

name = "ops"
main = "index.js"
compatibility_date = "2025-06-01"
account_id = "bd99f086b0a1faea1aafc301735623da"

[triggers]
crons = [
  "*/15 * * * *",
  "0 3 * * *",
  "0 6 * * *",
]

[vars]
GITHUB_REPO = "paglaai/paglaai.space"
SITE_URL = "https://www.paglaai.space"
