name: Ops · Scheduled

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduled:
    name: Scheduled jobs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run scheduled category jobs
        run: node ops/run-job.mjs scheduled
        env:
          SITE_URL: https://www.paglaai.space
          WORKER_URL: ${{ vars.WORKER_URL }}

      - name: Commit regenerated sitemap
        if: success()
        run: |
          if [ -n "$(git status --porcelain sitemap.xml)" ]; then
            git config user.name "paglaai-bot"
            git config user.email "bot@paglaai.space"
            git add sitemap.xml
            git commit -m "chore(sitemap): regenerate sitemap.xml [skip ci]"
            git push origin main
          else
            echo "sitemap.xml unchanged — nothing to commit."
          fi