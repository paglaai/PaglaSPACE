name: Ops · On-demand

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job name, category, or 'all' (see ops/jobs.json)"
        required: false
        default: all

permissions:
  contents: read

jobs:
  run:
    name: Run job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run job
        env:
          JOB_SELECTOR: ${{ inputs.job || 'all' }}
          SITE_URL: https://www.paglaai.space
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          set -euo pipefail
          case "$JOB_SELECTOR" in
            all|nightly|scheduled|on_demand|nightly-audit|sitemap-generate|health-check|ping-search|worker-verify)
              ;;
            *)
              echo "Invalid job selector: $JOB_SELECTOR" >&2
              exit 2
              ;;
          esac
          node ops/run-job.mjs "$JOB_SELECTOR"
